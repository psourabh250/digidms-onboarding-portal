<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiDMS - Distributor Registration Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0066cc;
            --primary-hover: #0052a3;
            --accent-bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --success-bg: #ecfdf5;
            --success-border: #a7f3d0;
            --success-text: #065f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .portal-container {
            width: 100%;
            max-width: 640px;
            background: var(--surface);
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .portal-header {
            padding: 32px 32px 24px;
            border-bottom: 1px solid var(--border);
            background: #ffffff;
        }

        .portal-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--primary);
            background: #eff6ff;
            padding: 4px 10px;
            border-radius: 9999px;
            margin-bottom: 10px;
        }

        .portal-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .portal-header p {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .portal-body {
            padding: 32px;
        }

        .alert-box {
            display: none;
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in-out;
        }

        .alert-success {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .alert-success strong {
            display: block;
            margin-bottom: 2px;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        label .required {
            color: #e11d48;
            margin-left: 2px;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-dark);
            background: #ffffff;
            transition: all 0.15s ease-in-out;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .divider {
            height: 1px;
            background-color: var(--border);
            margin: 24px 0 20px;
        }

        .submit-btn {
            width: 100%;
            height: 46px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.25);
        }

        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }

        @media (max-width: 600px) {
            .portal-container {
                border-radius: 10px;
            }
            .portal-header, .portal-body {
                padding: 24px 20px;
            }
            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>

<div class="portal-container">
    <div class="portal-header">
        <span class="portal-badge">Onboarding Intake</span>
        <h1>Distributor Registration</h1>
        <p>Please enter your legal business and tax details to begin account verification.</p>
    </div>

    <div class="portal-body">
        <!-- Success Alert Message (Shown on same page) -->
        <div id="successNotice" class="alert-box alert-success">
            <strong>Registration Submitted Successfully!</strong>
            Your application has been received and routed to our onboarding team for verification.
        </div>

        <!-- Hidden Target Frame to prevent full-page navigation -->
        <iframe name="targetHiddenFrame" id="targetHiddenFrame" style="display:none;"></iframe>

        <form id="registrationForm" 
              action="https://dspldms-dev-ed.develop.my.site.com/services/apexrest/v1/web-to-account/" 
              method="POST" 
              target="targetHiddenFrame">

            <div class="form-section-title">Business Information</div>

            <div class="form-group">
                <label>Legal Business Name <span class="required">*</span></label>
                <input type="text" name="accountName" placeholder="e.g. Apex Logistical Distributors LLP" required>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>GSTIN (15 Chars) <span class="required">*</span></label>
                    <input type="text" name="gstin" placeholder="27AAAAA0000A1Z5" maxlength="15" style="text-transform: uppercase;" required>
                </div>
                <div class="form-group">
                    <label>PAN (10 Chars) <span class="required">*</span></label>
                    <input type="text" name="pan" placeholder="AAAAA0000A" maxlength="10" style="text-transform: uppercase;" required>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Business Email <span class="required">*</span></label>
                    <input type="email" name="email" placeholder="contact@distributor.com" required>
                </div>
                <div class="form-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="tel" name="phone" placeholder="9876543210" required>
                </div>
            </div>

            <div class="divider"></div>
            <div class="form-section-title">Registered Office Address</div>

            <div class="form-group">
                <label>Street Address</label>
                <input type="text" name="billingStreet" placeholder="Plot 45, MIDC Industrial Area">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" name="billingCity" placeholder="Pune">
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" name="billingState" placeholder="Maharashtra">
                </div>
            </div>

            <div class="form-group">
                <label>Postal Code</label>
                <input type="text" name="billingPostalCode" placeholder="411057">
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Submit Registration</button>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById('registrationForm');
    const submitBtn = document.getElementById('submitBtn');
    const successNotice = document.getElementById('successNotice');
    const targetIframe = document.getElementById('targetHiddenFrame');

    let isSubmitting = false;

    form.addEventListener('submit', () => {
        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.innerText = 'Submitting...';
        successNotice.style.display = 'none';
    });

    targetIframe.addEventListener('load', () => {
        if (isSubmitting) {
            // 1. Reset all form input fields cleanly
            form.reset();

            // 2. Display success notification on the same page (no ID exposed)
            successNotice.style.display = 'block';

            // 3. Scroll gently to top of container to view success message
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // 4. Restore the submit button state
            submitBtn.disabled = false;
            submitBtn.innerText = 'Submit Registration';
            isSubmitting = false;
        }
    });
</script>

</body>
</html>
